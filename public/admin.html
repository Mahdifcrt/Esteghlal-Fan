<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | استقلال‌فن</title>
<style>
body{margin:0;background:#f3f5f8;font-family:Tahoma,Arial;color:#172033}.box{max-width:1000px;margin:30px auto;padding:0 15px}.head{background:#0756a8;color:#fff;padding:20px;border-radius:15px;display:flex;justify-content:space-between;align-items:center}.panel{background:#fff;margin-top:18px;padding:22px;border-radius:15px;box-shadow:0 4px 18px #0001}input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:8px;font-family:inherit}textarea{min-height:150px}button{border:0;border-radius:8px;padding:11px 17px;background:#0756a8;color:#fff;cursor:pointer;margin-left:7px}button.red{background:#d62828}.hidden{display:none}.item{border-bottom:1px solid #eee;padding:14px 0}.msg{padding:10px;background:#eef7ee;border-radius:8px;margin:10px 0}.err{background:#fff0f0}.check{width:auto}
</style></head><body><div class="box">
<div class="head"><b>پنل مدیریت استقلال‌فن</b><a href="/" style="color:white">مشاهده سایت</a></div>
<div id="login" class="panel"><h2>ورود مدیر</h2><input id="u" placeholder="نام کاربری"><input id="p" type="password" placeholder="رمز عبور"><button onclick="login()">ورود</button><div id="lm"></div></div>
<div id="app" class="hidden">
<div class="panel"><h2 id="formTitle">ثبت خبر جدید</h2><input id="title" placeholder="عنوان خبر"><select id="cat"><option>تیم</option><option>نقل‌وانتقالات</option><option>بازی‌ها</option><option>بازیکنان</option><option>حاشیه</option><option>عمومی</option></select><textarea id="body" placeholder="متن خبر"></textarea><input id="image" placeholder="آدرس تصویر (اختیاری)"><label><input class="check" type="checkbox" id="breaking"> خبر فوری</label><br><button onclick="save()">انتشار خبر</button><button onclick="resetForm()">پاک کردن</button><button class="red" onclick="logout()">خروج</button><div id="msg"></div></div>
<div class="panel"><h2>مدیریت اخبار</h2><div id="list"></div></div></div></div>
<script>
let editing=null;
const $=id=>document.getElementById(id);
async function check(){let r=await fetch("/api/me");let x=await r.json();if(x.loggedIn){$("login").classList.add("hidden");$("app").classList.remove("hidden");load()}else $("login").classList.remove("hidden")}
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("u").value,password:$("p").value})});let x=await r.json();if(r.ok){$("login").classList.add("hidden");$("app").classList.remove("hidden");load()}else $("lm").textContent=x.error}
async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()}
function resetForm(){editing=null;$("formTitle").textContent="ثبت خبر جدید";["title","body","image"].forEach(x=>$(x).value="");$("breaking").checked=false}
async function load(){let r=await fetch("/api/news");let n=await r.json();$("list").innerHTML=n.map(x=>`<div class="item"><b>${esc(x.title)}</b><div>${esc(x.category)} ${x.breaking?"🚨":""}</div><button onclick='edit(${JSON.stringify(x)})'>ویرایش</button><button class="red" onclick="del(${x.id})">حذف</button></div>`).join("")||"<p>خبری ثبت نشده.</p>"}
function edit(x){editing=x.id;$("formTitle").textContent="ویرایش خبر";$("title").value=x.title;$("cat").value=x.category;$("body").value=x.body;$("image").value=x.image||"";$("breaking").checked=!!x.breaking;scrollTo(0,0)}
async function save(){let data={title:$("title").value,category:$("cat").value,body:$("body").value,image:$("image").value,breaking:$("breaking").checked};let url=editing?"/api/news/"+editing:"/api/news";let method=editing?"PUT":"POST";let r=await fetch(url,{method,headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});let x=await r.json();$("msg").textContent=r.ok?"خبر با موفقیت ذخیره شد":x.error;if(r.ok){resetForm();load()}}
async function del(id){if(!confirm("این خبر حذف شود؟"))return;await fetch("/api/news/"+id,{method:"DELETE"});load()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
check();
</script></body></html>
